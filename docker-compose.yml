# DB_NAME, DB_USER, DB_PASSWORD and SECRET_KEY come from .env (compose reads it
# automatically); DB_HOST and the broker URL point at the containers instead.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: core.settings.dev
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: "True"
  DB_NAME: ${DB_NAME:-booking}
  DB_USER: ${DB_USER:-booking}
  DB_PASSWORD: ${DB_PASSWORD:-booking}
  DB_HOST: db
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  TIME_ZONE: Asia/Tashkent

# web, worker and beat all start only after migrations have been applied.
x-app: &app
  build: .
  image: booking-app
  environment: *app-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-booking}
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  migrate:
    build: .
    image: booking-app
    command: python manage.py migrate --noinput
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    # Dev server serves admin static files too; the image's default CMD uses gunicorn.
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A core worker -l info

  beat:
    <<: *app
    command: celery -A core beat -l info

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
